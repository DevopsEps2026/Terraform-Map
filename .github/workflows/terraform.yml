name: Terraform Validate

on:
  push:
    branches:
      - main
      - feature/create-resource-group

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        
        name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate